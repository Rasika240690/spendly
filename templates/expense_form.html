{% extends "base.html" %}

{% block title %}{{ action }} expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">{{ action }} expense</h1>
            <p class="auth-subtitle">Track your spending accurately</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" class="form-input" value="{{ expense['category'] if expense else '' }}" placeholder="Food, Travel, Bills..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" class="form-input" step="0.01" min="0" value="{{ expense['amount'] if expense else '' }}" placeholder="499.00" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" class="form-input" value="{{ expense['description'] if expense else '' }}" placeholder="Groceries, rent, fuel...">
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" value="{{ expense['date'] if expense else '' }}" required>
                </div>
                <button type="submit" class="btn-submit">Save expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to profile</a>
        </p>
    </div>
</section>
{% endblock %}
